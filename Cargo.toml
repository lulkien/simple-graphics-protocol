# The wire contract between the sgc daemon (@sgc) and its clients.
# Standalone crate (own repo): consumed by the daemon and every client
# library via path deps in dev, git deps once published.
[package]
name = "simple-graphics-protocol"
version = "0.1.0"
edition = "2024"
license = "Unlicense"
description = "Wire contract between the simple-graphics-controller daemon and its clients: messages, framing and SCM_RIGHTS fd passing"
repository = "https://github.com/lulkien/simple-graphics-protocol"
readme = "README.md"
keywords = ["ipc", "protocol", "unix-socket", "display", "drm"]
categories = ["network-programming", "os::unix-apis"]
rust-version = "1.85"
exclude = ["AGENT.md"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
rmp-serde = "1.3"
thiserror = "1.0"
nix = { version = "0.29", features = ["fs", "socket", "uio"] }
sendfd = { version = "0.4.4", features = ["tokio"] }

[lib]
crate-type = ["lib"]
